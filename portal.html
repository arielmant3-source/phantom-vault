<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#050507">
<title>קישורים</title><link rel="stylesheet" href="style.css">
</head><body><main>
<h1 id="title" style="font-family:inherit;letter-spacing:.5px;text-align:start"></h1>
<p class="small" id="sub" style="margin:4px 0 22px"></p>
<div class="grid" id="grid"></div>
<div class="card" id="empty" hidden><p class="small">הקישור חסר או פגום. צור אותו מחדש בכספת: אפליקציות ← אתר פורטל ← העתק קישור אישי.</p></div>
</main>
<script>
// The list lives ONLY in the URL fragment (#...), which browsers never send to the server.
(function(){
  var PKG='com.phantomvault.app';
  var h=location.hash.slice(1);
  function show(err){document.getElementById('empty').hidden=false;document.getElementById('title').textContent='קישורים';}
  if(h.indexOf('v1.')!==0) return show();
  try{
    var b=h.slice(3).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    var bytes=Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)});
    var d=JSON.parse(new TextDecoder().decode(bytes));
    document.title=d.t||'קישורים';
    document.getElementById('title').textContent=d.t||'קישורים';
    document.getElementById('sub').textContent=(d.a||[]).length+' קישורים';
    var g=document.getElementById('grid');
    (d.a||[]).forEach(function(e){
      var name=String(e[0]||''),tok=String(e[1]||'');
      if(!/^[A-Za-z0-9_-]{8,64}$/.test(tok))return;
      var a=document.createElement('a');a.className='tile';
      a.href='intent://launch/'+tok+'#Intent;scheme=phantomvault;package='+PKG+';end';
      var ic=document.createElement('div');ic.className='ic';ic.textContent=(Array.from(name)[0]||'•').toUpperCase();
      var nm=document.createElement('div');nm.className='nm';nm.textContent=name;
      a.appendChild(ic);a.appendChild(nm);g.appendChild(a);
    });
  }catch(e){show();}
})();
</script>
</body></html>
